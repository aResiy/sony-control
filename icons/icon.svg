<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2247"/><stop offset=".55" stop-color="#0a0f22"/><stop offset="1" stop-color="#1f0f3d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee3ff"/><stop offset="1" stop-color="#9b6cff"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#halo)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="56.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <!-- headband -->
    <path d="M58 150 V128 a70 70 0 0 1 140 0 V150" stroke-width="16"/>
    <!-- cups -->
    <rect x="44" y="136" width="40" height="70" rx="20" fill="url(#neon)" stroke="none"/>
    <rect x="172" y="136" width="40" height="70" rx="20" fill="url(#neon)" stroke="none"/>
    <!-- sound wave -->
    <path d="M108 171 v10 M118 160 v32 M128 152 v48 M138 160 v32 M148 171 v10" stroke-width="7"/>
  </g>
  <rect x="52" y="146" width="10" height="44" rx="5" fill="#fff" fill-opacity=".35"/>
  <rect x="180" y="146" width="10" height="44" rx="5" fill="#fff" fill-opacity=".2"/>
</svg>
